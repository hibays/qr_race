<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>scan probe</title>
</head>
<body>
  <pre id="out">starting</pre>
  <script type="module">
    import './scan/camera_scan.js';

    // Browser probe for the camera → wasm scan path. Served from the same
    // directory as scan/camera_scan.js:
    //   python -m http.server 18450 --bind 127.0.0.1
    //   msedge --headless=new --use-fake-ui-for-media-stream \
    //     --use-fake-device-for-media-stream \
    //     --use-file-for-fake-video-capture=probe.y4m \
    //     --autoplay-policy=no-user-gesture-required \
    //     --virtual-time-budget=15000 --dump-dom \
    //     http://127.0.0.1:18450/scan_probe.html
    const out = document.getElementById('out');
    window.qrProbeState = { frames: 0, width: 0, height: 0, error: null };
    function log(message) {
      out.textContent = message;
      document.title = message;
    }

    async function waitForGlobals() {
      for (let i = 0; i < 100; i++) {
        if (window.qrRaceStartCameraScan && window.qrRaceScanReady) return;
        await new Promise((resolve) => setTimeout(resolve, 50));
      }
      throw new Error('camera_scan.js did not load');
    }

    async function main() {
      try {
        await waitForGlobals();
        await window.qrRaceScanReady;
        log('READY');
        const hit = await new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('no hit within 12s')), 12000);
          window.qrRaceStartCameraScan(
            (json) => {
              const result = JSON.parse(json);
              window.qrProbeState = {
                frames: window.qrProbeState.frames + 1,
                width: result.width,
                height: result.height,
                scanMs: result.scan_ms,
                hit: result.hits.length > 0 ? result.hits[0].text : null,
                error: result.error,
              };
              if (result.hits && result.hits.length > 0) {
                clearTimeout(timer);
                resolve(result.hits[0]);
              } else {
                log(`WAIT ${result.width}x${result.height} error=${result.error}`);
              }
            },
            (error) => {
              clearTimeout(timer);
              reject(new Error(error));
            },
          );
          window.qrRaceScanReady.catch((error) => reject(new Error(String(error))));
        });
        const raw = atob(hit.raw_b64);
        log('HIT:' + raw);
      } catch (error) {
        log('ERROR:' + (error && error.message ? error.message : error));
      }
    }

    main();
  </script>
</body>
</html>
