[package]
name = "qr_race_scan"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["image-io", "timing"]
# File/bytes loading for native tools. The wasm build turns this off so the
# browser artifacts don't drag in image decoders and their wasm-bindgen imports.
image-io = ["dep:image"]
# Real clocks. Disabled on wasm32-unknown-unknown, where Instant::now panics.
timing = []

[dependencies]
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
], optional = true }
thiserror.workspace = true
zxing-cpp.workspace = true

[dev-dependencies]
qrcode = "0.14"



