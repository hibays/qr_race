[package]
name = "qr_race_wechat"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The ported module docs come from wxscan and reference its crate names.
doctest = false

[features]
default = ["ort", "xnnpack", "coreml"]
ort = ["dep:ort"]
xnnpack = []
coreml = []
lele = ["dep:lele"]

[dependencies]
qr_race_scan.workspace = true
cvlite = { path = "../cvlite" }
zxing-cpp = { version = "0.5.3", default-features = false }
lele = { version = "=0.1.16", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "xnnpack", "coreml"], optional = true }

[dev-dependencies]
qrcode = "0.14"
qr_race_fixtures.workspace = true


[target.'cfg(not(target_os = "android"))'.dependencies]
zxing-cpp = { version = "0.5.3", default-features = false, features = ["bundled"] }


[build-dependencies]
lele = { version = "=0.1.16", features = ["compiler"] }






