[package]
name = "qr_race_wechat"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The ported module docs come from wxscan and reference its crate names.
doctest = false

[features]
default = ["tract"]
st-zrt = ["dep:st-zrt"]
tract = ["dep:tract-onnx"]

[dependencies]
qr_race_scan.workspace = true
cvlite = { path = "../cvlite" }
zxing-cpp = { version = "0.5.3", default-features = false }
tract-onnx = { version = "0.21", optional = true }
st-zrt = { version = "0.4.1", default-features = false, optional = true }

[dev-dependencies]
qrcode = "0.14"
qr_race_fixtures.workspace = true


[target.'cfg(not(target_os = "android"))'.dependencies]
zxing-cpp = { version = "0.5.3", default-features = false, features = ["bundled"] }

