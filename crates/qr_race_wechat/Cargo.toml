[package]
name = "qr_race_wechat"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The ported module docs come from wxscan and reference its crate names.
doctest = false

[features]
default = ["tract"]
ort = ["dep:ort"]
tract = ["dep:tract-onnx"]

[dependencies]
qr_race_scan.workspace = true
cvlite = { path = "../cvlite" }
zxing-cpp.workspace = true
tract-onnx = { version = "0.21", optional = true }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic"], optional = true }

[dev-dependencies]
qrcode = "0.14"
qr_race_fixtures.workspace = true

