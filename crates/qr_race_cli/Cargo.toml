[package]
name = "qr_race_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "qr_scan"
path = "src/main.rs"

[dependencies]
clap.workspace = true
data-encoding.workspace = true
percent-encoding.workspace = true
qr_race_capture.workspace = true
qr_race_capture_desktop.workspace = true
qr_race_core.workspace = true
qr_race_scan.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = "0.14"
qr_race_api.workspace = true
qr_race_hub.workspace = true
qr_race_tls.workspace = true
