[package]
name = "qr_race_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["desktop-camera"]
# Camera capture is desktop-only today. Android builds disable it and use the
# JNI/Camera2 mobile session instead; QR rendering stays available everywhere.
desktop-camera = ["dep:qr_race_capture_desktop"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
data-encoding.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg"] }
qr_race_capture.workspace = true
qr_race_pipeline.workspace = true
qr_race_capture_desktop = { workspace = true, optional = true }
qr_race_embedded.workspace = true
qr_race_qr.workspace = true
# Scanning uses only GrayFrame/ScanEngine here; file decoders (and their PNG/BMP
# image-rs features) are not part of the scanner or the mobile bridge.
qr_race_scan = { workspace = true, default-features = false, features = ["timing"] }
yuv.workspace = true
qr_race_tls.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# ONNX Runtime 1.29 is packaged per ABI and loaded dynamically by ort.
qr_race_wechat = { workspace = true, default-features = false, features = ["ort", "xnnpack"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
qr_race_wechat = { workspace = true, default-features = false, features = ["ort", "xnnpack"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
qrcode = "0.14"






